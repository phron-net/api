name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, generated code, vet, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Lint, regenerate and tidy
        run: ./scripts/generate.sh
      - name: gen/, go.mod and go.sum are up to date
        run: |
          git add -N gen
          git diff --exit-code -- gen go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
